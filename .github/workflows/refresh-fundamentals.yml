name: Refresh Fundamentals

on:
  schedule:
    # Market cap and insider sentiment both move far slower than quotes —
    # insider data is monthly and lags 1-2 months — so this runs daily instead
    # of riding the 30-minute quote loop, which would double that job's runtime
    # for data that cannot have changed.
    - cron: "0 6 * * *"
  workflow_dispatch:

# actions:read lets the wait step see the quote job's runs. Declaring any
# permission drops the defaults, so contents:read is restated for checkout.
permissions:
  contents: read
  actions: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      # The quote job skips itself while this one runs (see refresh-data.yml),
      # but one already mid-run when this starts would still overlap, so wait
      # it out. A quote run takes ~5-7 min; capped at 20 min so a stuck run
      # delays the daily refresh rather than blocking it.
      - name: Wait for any running quote refresh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 40); do
            running=$(gh run list -R "$GITHUB_REPOSITORY" --workflow refresh-data.yml --status in_progress --json databaseId -q length)
            [ "$running" -eq 0 ] && exit 0
            echo "Quote refresh in progress; waiting 30s ($i/40)."
            sleep 30
          done
          echo "Still running after 20 min; proceeding anyway."

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Run fundamentals refresh script
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
        run: node scripts/refresh-fundamentals.js

      # Daily closes and the T-bill rate for the Risk-Adjusted Return box. Was
      # run by hand only, so the box sat on July data for three months.
      - name: Run price history backfill
        if: ${{ !cancelled() }}
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: node scripts/backfill-price-history.js
